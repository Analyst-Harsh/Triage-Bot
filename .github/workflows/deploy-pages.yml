name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "github_page/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: github_page
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: github_page/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: github_page/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Overrides the workflow-level `contents: read` default: only this job
    # talks to the Pages API / requests an OIDC token to publish the
    # artifact. The build job stays read-only.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        id: configure
        uses: actions/configure-pages@v6

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Job summary
        if: always()
        run: |
          icon() { case "$1" in success) echo "✅";; failure) echo "❌";; skipped) echo "⏭️";; *) echo "⚠️";; esac; }
          {
            echo "### Deploy Pages"
            echo ""
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Build | $(icon ${{ needs.build.result }}) |"
            echo "| Configure Pages | $(icon ${{ steps.configure.outcome }}) |"
            echo "| Deploy | $(icon ${{ steps.deployment.outcome }}) |"
            if [ -n "${{ steps.deployment.outputs.page_url }}" ]; then
              echo ""
              echo "**Live site:** ${{ steps.deployment.outputs.page_url }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
