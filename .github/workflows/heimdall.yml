name: Heimdall

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/heimdall.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/heimdall.yml"

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

        # Build when we deploy
      # - name: Build
      #   run: npm run build
